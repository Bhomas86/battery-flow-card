name: Build v0.2.0 Release Candidate

on:
  push:
    branches:
      - release/v0.2.0-rc

permissions:
  contents: write

# Keep only the latest test build when the release branch is updated.
concurrency:
  group: battery-flow-card-v0.2.0-rc
  cancel-in-progress: true

jobs:
  test-build:
    name: Check, build and publish RC test file
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run check

      - name: Build
        run: npm run build

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: battery-flow-card-v0.2.0-rc
          path: dist/battery-flow-card.js
          if-no-files-found: error
          retention-days: 14

      - name: Publish standalone JS to test-builds branch
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: test-builds
          TARGET_FILE: v0.2.0-rc/battery-flow-card.js
        shell: bash
        run: |
          set -euo pipefail
          content="$(base64 -w 0 dist/battery-flow-card.js)"
          existing_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$TARGET_FILE?ref=$TARGET_BRANCH" --jq '.sha' 2>/dev/null || true)"

          jq -n \
            --arg branch "$TARGET_BRANCH" \
            --arg message "build: update v0.2.0 RC from ${GITHUB_SHA:0:7}" \
            --arg content "$content" \
            --arg sha "$existing_sha" \
            '({branch: $branch, message: $message, content: $content} +
              (if $sha == "" then {} else {sha: $sha} end))' > "$RUNNER_TEMP/publish.json"

          gh api --method PUT \
            "repos/$GITHUB_REPOSITORY/contents/$TARGET_FILE" \
            --input "$RUNNER_TEMP/publish.json" > /dev/null

          echo "RC download: https://github.com/$GITHUB_REPOSITORY/blob/$TARGET_BRANCH/$TARGET_FILE"
