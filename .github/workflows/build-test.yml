name: Build Test JavaScript

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run check

      - name: Build JavaScript
        run: npm run build

      - name: Upload test JavaScript
        uses: actions/upload-artifact@v4
        with:
          name: battery-flow-card-test
          path: dist/battery-flow-card.js
          if-no-files-found: error
          retention-days: 30
