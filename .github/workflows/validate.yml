name: Validate

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: plugin