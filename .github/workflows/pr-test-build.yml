name: Build PR Test Version

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    name: Build downloadable JavaScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run check

      - name: Build the card
        run: npm run build

      - name: Upload test JavaScript
        uses: actions/upload-artifact@v4
        with:
          name: battery-flow-card-test-pr-${{ github.event.pull_request.number }}
          path: dist/battery-flow-card.js
          if-no-files-found: error
          retention-days: 14
