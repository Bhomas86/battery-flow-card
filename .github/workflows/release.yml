name: Build Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Publish v0.2.0 from main (one time)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.2.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already published; skipping."
            exit 0
          fi
          gh release create "$TAG" dist/battery-flow-card.js \
            --target "$GITHUB_SHA" \
            --title "Battery Flow Card v0.2.0" \
            --notes-file .github/RELEASE_NOTES_v0.2.0.md

      - name: Synchronize v0.2.0 release notes
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v0.2.0" >/dev/null 2>&1; then
            gh release edit "v0.2.0" --notes-file .github/RELEASE_NOTES_v0.2.0.md
          fi

      - name: Create or update tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$TAG" = "v0.2.0" ]; then
              gh release create "$TAG" --title "$TAG" --notes-file .github/RELEASE_NOTES_v0.2.0.md
            else
              gh release create "$TAG" --title "$TAG" --generate-notes
            fi
          fi
          gh release upload "$TAG" dist/battery-flow-card.js --clobber
