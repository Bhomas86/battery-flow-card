<text x="215" y="249" class="txt small">Estimated time</text><text x="600" y="249" text-anchor="end" class="txt value">—</text>
<text x="24" y="326" class="txt" font-size="14">Max. discharge: 3.5 kW</text>
<text x="616" y="326" text-anchor="end" class="txt" font-size="14">Max. charge: 3.5 kW</text>
<rect x="24" y="341" width="592" height="15" rx="5" fill="#e5e5e5"/>

<rect x="318" y="338" width="4" height="21" fill="#424242"/>
